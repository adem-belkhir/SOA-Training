enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}

type UniteEnseignement {
    code: Int
    domaine: String
    responsable: String
    credits: Int
    semestre: Int
}

type Module {
    matricule: String
    nom: String
    coefficient: Int
    volumeHoraire: Int
    type: TypeModule
    uniteEnseignement: UniteEnseignement
}

type QueryResolver {
    # UE
    allUEs: [UniteEnseignement]
    ueByCode(code: Int!): UniteEnseignement
    ueByDomaine(domaine: String!): [UniteEnseignement]
    ueBySemestre(semestre: Int!): [UniteEnseignement]

    # Modules
    allModules: [Module]
    moduleByMatricule(matricule: String!): Module
    modulesByType(type: TypeModule!): [Module]
    modulesByUE(codeUE: Int!): [Module]
}

type MutationResolver {
    # UE
    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    updateUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    deleteUniteEnseignement(
        code: Int!
    ): Boolean

    # Modules
    addModule(
        matricule: String!
        nom: String!
        coefficient: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Boolean

    updateModule(
        matricule: String!
        nom: String!
        coefficient: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Boolean

    deleteModule(
        matricule: String!
    ): Boolean
}

schema {
    query: QueryResolver
    mutation: MutationResolver
}